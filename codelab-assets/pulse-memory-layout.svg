<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" font-family="JetBrains Mono, Consolas, monospace">
  <rect width="860" height="230" rx="14" fill="#0b1220" />
  <text x="30" y="38" fill="#22d3ee" font-size="15" font-weight="700" font-family="Inter, sans-serif">Multiplexed QNX Receive Buffer Layout (lab_msg_t) — Why struct _pulse Must Come First</text>

  <!-- Byte Ruler -->
  <text x="35" y="72" fill="#64748b" font-size="11">Byte 0</text>
  <text x="315" y="72" fill="#64748b" font-size="11">Byte 16</text>
  <text x="455" y="72" fill="#64748b" font-size="11">Byte 20</text>
  <text x="595" y="72" fill="#64748b" font-size="11">Byte 24</text>
  <text x="765" y="72" fill="#64748b" font-size="11">Byte 32</text>

  <!-- Memory Blocks -->
  <rect x="30" y="82" width="290" height="72" rx="6" fill="#082f49" stroke="#22d3ee" stroke-width="2" />
  <text x="50" y="113" fill="#67e8f9" font-size="14" font-weight="700">struct _pulse hdr</text>
  <text x="50" y="136" fill="#bae6fd" font-size="11.5">code | priority | sival_int | scoid</text>

  <rect x="326" y="82" width="130" height="72" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
  <text x="344" y="113" fill="#f8fafc" font-size="13" font-weight="700">uint16_t type</text>
  <text x="344" y="136" fill="#94a3b8" font-size="11">+ alignment pad</text>

  <rect x="462" y="82" width="130" height="72" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
  <text x="480" y="113" fill="#f8fafc" font-size="13" font-weight="700">uint32_t seq</text>
  <text x="480" y="136" fill="#94a3b8" font-size="11">1kHz counter</text>

  <rect x="598" y="82" width="230" height="72" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.8" />
  <text x="618" y="113" fill="#4ade80" font-size="13" font-weight="700">double target_mm</text>
  <text x="618" y="136" fill="#bbf7d0" font-size="11">Clamped to |x| <= 18.00 mm</text>

  <text x="30" y="186" fill="#4ade80" font-size="12.5" font-family="Inter, sans-serif">• rcvid == 0 (Kernel Pulse): Microkernel writes 16 bytes into hdr; check msg.hdr.code == PULSE_CODE_HEARTBEAT.</text>
  <text x="30" y="208" fill="#38bdf8" font-size="12.5" font-family="Inter, sans-serif">• rcvid > 0  (Client MsgSend): Microkernel copies full lab_msg_t payload; validate & MsgReply(rcvid, ...).</text>
</svg>