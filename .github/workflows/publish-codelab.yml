name: Build & Deploy Interactive QNX Codelab

on:
  push:
    branches: [ main ]
    paths:
      - 'CODELAB.md'
      - '.github/workflows/publish-codelab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install claat & export CODELAB.md
        run: |
          go install github.com/googlecodelabs/tools/claat@latest
          mkdir -p _site
          "$(go env GOPATH)/bin/claat" export -o _site CODELAB.md
          touch _site/.nojekyll
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./qnx8-deterministic-ipc-safety-cage/index.html">
            </head>
            <body>
              <a href="./qnx8-deterministic-ipc-safety-cage/index.html">Open QNX 8.0 Interactive Codelab</a>
            </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
