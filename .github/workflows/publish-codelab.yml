name: Build & Deploy Interactive QNX Codelab

on:
  push:
    branches: [ main ]
    paths:
      - 'CODELAB.md'
      - 'codelab-assets/**'
      - 'scripts/build_codelab_site.py'
      - '.github/workflows/publish-codelab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build Codelab site, PNG diagrams, and Starter ZIP
        run: |
          python3 -m pip install --break-system-packages --quiet Pillow
          go install github.com/googlecodelabs/tools/claat@latest
          python3 scripts/build_codelab_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
