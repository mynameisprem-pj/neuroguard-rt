name: Build & Deploy Interactive QNX Codelab

on:
  push:
    branches: [ main ]
    paths:
      - 'CODELAB.md'
      - '.github/workflows/publish-codelab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Export CODELAB.md with claat
        run: |
          curl -fsSL https://github.com/googlecodelabs/tools/releases/download/v2.2.5/claat-linux-amd64 -o claat
          chmod +x claat
          mkdir -p _site
          ./claat export -o _site CODELAB.md
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./qnx8-deterministic-ipc-safety-cage/index.html"></head><body><a href="./qnx8-deterministic-ipc-safety-cage/index.html">Open QNX 8.0 Codelab</a></body></html>' > _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
